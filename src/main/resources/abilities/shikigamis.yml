Highlight:
  Enabled: true

Regen:
  PeriodTicks: 200

ItemLoreUpdatePeriodTicks: 10

AiTickPeriodTicks: 1

Types:
  WHITE_DIVINE_DOG:
    EntityType: WOLF
    CursedEnergyDrainAmount: 10
    HighlightColor: WHITE

    Behavior: GROUND_MELEE

    Scale: 1.5
    Speed: 0.5
    Damage: 7.5
    Health: 40.0
    RegenAmount: 0.25
    DespawnedRegenPerSecond: 1
    FollowRange: 64.0

    DefaultTamed: true
    DefaultSummonable: true

    Track:
      CooldownMillis: 1500
      CursedEnergyCost: 0
      Color: "#A793D0"
      EntityColor: WHITE

    Charge:
      Speed: 2.5
      Damage: 5.0
      StunDurationMillis: 1000
      MaxDurationMillis: 5000
      HitRadius: 1.5
      TickInterval: 1
      CooldownMillis: 5000

      Particle:
        Type: CLOUD
        Count: 1
        Spread: 0.3
        Speed: 0.02
        DistanceBehind: 2.0

    DisplayName: "<#BCAED7>White Divine Dog"
    Lore:
      Line1: "<#74668F>Press <key:key.sneak> + Right Click to despawn"
      Line2: "<#74668F>Right Click a Block to recall"
      Line3: "<#74668F>Right Click while looking at Target to attack"
      Line4: "<#74668F>Right Click an Entity to track them"
      Line5: "<#74668F>Press <key:key.drop> while looking at Target to charge"

  BLACK_DIVINE_DOG:
    EntityType: WOLF
    CursedEnergyDrainAmount: 10
    HighlightColor: DARK_BLUE

    Behavior: GROUND_MELEE

    Scale: 1.5
    Speed: 0.5
    Damage: 7.5
    Health: 40.0
    RegenAmount: 0.25
    DespawnedRegenPerSecond: 1
    FollowRange: 64.0

    DefaultTamed: true
    DefaultSummonable: true

    Track:
      CooldownMillis: 1500
      CursedEnergyCost: 0
      Color: "#392B54"
      EntityColor: DARK_BLUE

    Charge:
      Speed: 2.0
      Damage: 5.0
      StunDurationMillis: 1000
      MaxDurationMillis: 5000
      HitRadius: 1.5
      TickInterval: 1
      CooldownMillis: 5000

      Particle:
        Type: CLOUD
        Count: 3
        Spread: 0.15
        Speed: 0.02
        DistanceBehind: 1.0

    DisplayName: "<#221F28>Black Divine Dog"
    Lore:
      Line1: "<#74668F>Press <key:key.sneak> + Right Click to despawn"
      Line2: "<#74668F>Right Click a Block to recall"
      Line3: "<#74668F>Right Click while looking at Target to attack"
      Line4: "<#74668F>Right Click an Entity to track them"
      Line5: "<#74668F>Press <key:key.drop> while looking at Target to charge"

  NUE:
    EntityType: WOLF
    CursedEnergyDrainAmount: 40
    HighlightColor: DARK_PURPLE

    # FLIGHT behavior has no track or charge ability — just idle flight + attack/recall, driven
    # entirely by the Flight config below. It does support carrying (Carry config below).
    Behavior: FLIGHT

    Scale: 2.5
    Speed: 0.5
    Damage: 5.0
    Health: 80.0
    RegenAmount: 0.25
    DespawnedRegenPerSecond: 1
    FollowRange: 64.0

    DefaultTamed: true
    DefaultSummonable: true

    Flight:
      OrbitRadius: 2.5
      HeightOffset: 2.5
      Speed: 1.0
      AngularSpeedDegreesPerSecond: 20.0
      AttackRange: 2.0
      AttackIntervalMillis: 1000

    Carry:
      Speed: 1.2
      VerticalSpeed: 1.0
      SeatOffset: 0.6
      PickupRange: 1.5

    Shield:
      ApproachRange: 1.5
      HoverDistance: 1.5
      MaxDamageBlocked: 5.0
      MaxDurationMillis: 5000
      CooldownMillis: 4000
      CursedEnergyCost: 0

      Title:
        Text: "<#984DC4>Shielded!"
        Subtitle: "<#74668F>Nue is protecting you"
        FadeInTicks: 10
        StayTicks: 200
        FadeOutTicks: 10

    Clap:
      Radius: 4.0
      Damage: 12.0
      CooldownMillis: 4000
      CursedEnergyCost: 0
      UseLightningEffect: true
      Particle:
        Type: DUST
        Count: 40
        Spread: 1.5
        Speed: 0.05
        Color: "#8B2FC9"
        Size: 1.5

    DisplayName: "<#984DC4>Nue"
    Lore:
      Line1: "<#74668F>Press <key:key.sneak> + Right Click to despawn"
      Line2: "<#74668F>Right Click a Block to recall"
      Line3: "<#74668F>Right Click while looking at Target to attack"
      Line4: "<#74668F>Right Click to make Nue Carry you"
      Line5: "<#74668F>Hold Sneak to make Nue shield you"
      Line6: "<#74668F>Press <key:key.swap> for Electric Wing Clap"

Order:
  TargetRange: 30.0
  TargetRaySize: 0.4

CursedEnergy:
  DrainPeriodTicks: 20
